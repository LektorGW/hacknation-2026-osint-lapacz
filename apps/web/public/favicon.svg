<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="OŁCyŚ — sowa śledząca cyfrowe ślady">
  <title>OŁCyŚ</title>
  <defs>
    <linearGradient id="tlo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a73"/>
      <stop offset="1" stop-color="#080f24"/>
    </linearGradient>
    <radialGradient id="blask" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cialo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5287d8"/>
      <stop offset="1" stop-color="#22488c"/>
    </linearGradient>
    <radialGradient id="teczowka" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ee9b16"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#tlo)"/>
  <rect width="128" height="128" rx="28" fill="url(#blask)"/>

  <!-- Sylwetka sowy z pióropuszami uszu -->
  <path d="M30 46 L35 17 L53 34 Q64 30.5 75 34 L93 17 L98 46 Q108.5 64 102 84 Q94 108 64 110 Q34 108 26 84 Q19.5 64 30 46 Z" fill="url(#cialo)"/>
  <!-- Szlara (tarcza twarzy) -->
  <circle cx="48" cy="58" r="23" fill="#7fb0f5" opacity="0.2"/>
  <circle cx="80" cy="58" r="23" fill="#7fb0f5" opacity="0.2"/>

  <!-- Brwi: uważne, śledcze spojrzenie -->
  <path d="M31 40 Q47 34 61 45" fill="none" stroke="#0c1a38" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M97 40 Q81 34 67 45" fill="none" stroke="#0c1a38" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Oczy: pierścień – ogniwo – pierścień, czyli łańcuch bloków -->
  <circle cx="47" cy="59" r="15.5" fill="#0a1430" stroke="#bcd9ff" stroke-width="6"/>
  <circle cx="81" cy="59" r="15.5" fill="#0a1430" stroke="#bcd9ff" stroke-width="6"/>
  <rect x="57.5" y="53.5" width="13" height="11" rx="5.5" fill="none" stroke="#bcd9ff" stroke-width="4.5"/>

  <!-- Tęczówki, źrenice, połysk -->
  <circle cx="48.5" cy="60" r="8.6" fill="url(#teczowka)"/>
  <circle cx="82.5" cy="60" r="8.6" fill="url(#teczowka)"/>
  <circle cx="49" cy="60.5" r="3.8" fill="#0a1430"/>
  <circle cx="83" cy="60.5" r="3.8" fill="#0a1430"/>
  <circle cx="51.6" cy="57.4" r="2" fill="#fff8e6"/>
  <circle cx="85.6" cy="57.4" r="2" fill="#fff8e6"/>

  <!-- Dziób -->
  <path d="M59.5 73 Q64 70.5 68.5 73 L64 82 Z" fill="#f5b942"/>

  <!-- Pióra na piersi -->
  <path d="M50 91 l5 3.6 l5 -3.6 M68 91 l5 3.6 l5 -3.6 M59 99 l5 3.6 l5 -3.6" fill="none" stroke="#a9c8f6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Cyfrowy ślad: węzły sieci prowadzące do celu -->
  <path d="M20 119 L42 116 L64 120 L86 116 L108 119" fill="none" stroke="#bcd9ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="20" cy="119" r="3" fill="#bcd9ff" opacity="0.55"/>
  <circle cx="42" cy="116" r="3" fill="#bcd9ff" opacity="0.75"/>
  <circle cx="64" cy="120" r="3" fill="#bcd9ff" opacity="0.9"/>
  <circle cx="86" cy="116" r="3" fill="#bcd9ff" opacity="0.75"/>
  <circle cx="108" cy="119" r="4.2" fill="#f5b942"/>
</svg>
